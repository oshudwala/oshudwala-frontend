<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="maleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4EA"/>
      <stop offset="100%" stop-color="#CEEAD6"/>
    </linearGradient>
    <linearGradient id="maleCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="maleShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#maleBg)" stroke="#10B981" stroke-width="2.5"/>

  <!-- Shoulders / Torso -->
  <path d="M26 108 C 26 88, 38 78, 60 78 C 82 78, 94 88, 94 108 Z" fill="url(#maleShirt)"/>
  
  <!-- Shirt Collar -->
  <polygon points="60,88 50,78 60,74 70,78" fill="#F8FAFC"/>
  <polygon points="60,88 56,76 60,74 64,76" fill="#047857"/>

  <!-- Neck -->
  <rect x="52" y="62" width="16" height="18" rx="4" fill="#F5CBA7"/>
  <path d="M52 69 C 56 73, 64 73, 68 69 L 68 76 L 52 76 Z" fill="#E59866" opacity="0.3"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="50" rx="19" ry="21" fill="#F5CBA7"/>

  <!-- Ears -->
  <circle cx="41" cy="51" r="4.5" fill="#F5CBA7"/>
  <circle cx="79" cy="51" r="4.5" fill="#F5CBA7"/>

  <!-- Hair (Side & Back) -->
  <path d="M41 48 C 41 33, 50 28, 60 28 C 70 28, 79 33, 79 48 C 76 43, 73 40, 68 39 C 64 39, 56 39, 52 39 C 47 40, 44 43, 41 48 Z" fill="#2D3748"/>

  <!-- Courier Cap -->
  <path d="M39 42 C 40 26, 49 20, 60 20 C 71 20, 80 26, 81 42 Z" fill="url(#maleCap)"/>
  <!-- Cap Visor -->
  <path d="M37 42 C 48 38, 72 38, 83 42 C 86 43, 84 46, 78 46 C 68 46, 52 46, 42 46 C 36 46, 34 43, 37 42 Z" fill="#065F46"/>
  <!-- Cap Badge (Oshud Wala Medical Cross) -->
  <circle cx="60" cy="31" r="4" fill="#FFFFFF"/>
  <rect x="58.5" y="29" width="3" height="4" rx="0.5" fill="#10B981"/>
  <rect x="57" y="30.5" width="6" height="1" rx="0.5" fill="#10B981"/>

  <!-- Eyebrows -->
  <path d="M48 45 Q 52 43 56 45" stroke="#2D3748" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M64 45 Q 68 43 72 45" stroke="#2D3748" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="52" cy="49" r="2.2" fill="#1E293B"/>
  <circle cx="68" cy="49" r="2.2" fill="#1E293B"/>
  <circle cx="51.2" cy="48.2" r="0.7" fill="#FFFFFF"/>
  <circle cx="67.2" cy="48.2" r="0.7" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M60 48 L 59 54 L 62 54" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

  <!-- Friendly Smile -->
  <path d="M54 58 Q 60 63 66 58" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
